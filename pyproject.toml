[project]
name = "bookfindr"
version = "0.1.0"
description = "Daily tracker for new computer books with FastAPI + SQLite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.53.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3,<4",
    "python-dotenv>=1.2.3",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.12",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "anyio>=4.15.1",
    "ruff>=0.16.8",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"
